<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | EnvoyTrade</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body {
      margin: 0;
      background-color: #0f1117;
      color: #f0f0f2;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }
    .box {
      max-width: 480px;
      padding: 2.5rem;
      background: #1a1c24;
      border: 1px solid #2a2c34;
      border-radius: 1rem;
    }
    h1 {
      font-size: 3.5rem;
      margin: 0 0 0.5rem;
      color: #06d896;
    }
    h2 {
      font-size: 1.25rem;
      margin: 0 0 1rem;
    }
    p {
      color: #9da3ae;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: #04b488;
      color: #0f1117;
      font-weight: 700;
      padding: 0.75rem 1.75rem;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #06d896;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for does not exist or has been moved. Click below to return to the EnvoyTrade home page.</p>
    <a href="./" id="home-btn" class="btn">Return to Home</a>
  </div>
  <script>
    (function() {
      try {
        var base = location.hostname.endsWith('github.io') ? '/' + location.pathname.split('/').filter(Boolean)[0] + '/' : '/';
        var btn = document.getElementById('home-btn');
        if (btn) btn.setAttribute('href', base);
      } catch(e) {}
    })();
  </script>
</body>
</html>
