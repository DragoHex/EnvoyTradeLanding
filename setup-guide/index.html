<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setup Guide - Platform Onboarding | EnvoyTrade</title>
  <meta name="description" content="Step-by-step onboarding guide for configuring Zerodha, Angel One, and Indian broker accounts on EnvoyTrade." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    (function() {
      try {
        var s = localStorage.getItem('envoytrade_theme');
        var t = s === 'light' || s === 'dark' ? s : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
      } catch(e) {}
    })();
  </script>
</head>
<body class="bg-brand-dark text-brand-light">
  <div id="root"></div>
  <script type="module" src="/src/entries/setupGuide.tsx"></script>
</body>
</html>
